name: DevSecOps CI/CD Security Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  pull-requests: write
  actions: read

jobs:
  # -------------------------------------------------------------
  # Stage 1: Secret Scanning (Shift-Left)
  # -------------------------------------------------------------
  secret-scan:
    name: 🔑 Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Detector
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
        continue-on-error: true

      - name: Create Reports Directory
        run: mkdir -p reports

      - name: Execute Standalone Gitleaks Export
        run: |
          if command -v gitleaks &> /dev/null; then
            gitleaks dir . -c .gitleaks.toml --report-path reports/gitleaks.json --report-format json || true
          else
            echo "[]" > reports/gitleaks.json
          fi

      - name: Upload Secret Scan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: reports/gitleaks.json
          retention-days: 7

  # -------------------------------------------------------------
  # Stage 2: SAST & Dependency Vulnerability Analysis (SCA)
  # -------------------------------------------------------------
  sast-and-sca:
    name: 🔍 SAST (Semgrep) & SCA (Trivy / pip-audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install Analysis Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install semgrep pip-audit pyyaml

      - name: Create Reports Directory
        run: mkdir -p reports

      - name: Run Semgrep SAST Analysis
        run: |
          semgrep scan --config=.semgrep/rules.yml --config=p/owasp-top-ten --json -o reports/semgrep.json || true
          semgrep scan --config=.semgrep/rules.yml --sarif -o reports/semgrep.sarif || true
        continue-on-error: true

      - name: Run Trivy File System & Dependency Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'json'
          output: 'reports/trivy.json'
        continue-on-error: true

      - name: Run Python Dependency Audit (pip-audit)
        run: |
          pip-audit -r requirements.txt --format json -o reports/pip-audit.json || true
        continue-on-error: true

      - name: Upload SAST and SCA Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sast-sca-reports
          path: |
            reports/semgrep.json
            reports/semgrep.sarif
            reports/trivy.json
            reports/pip-audit.json
          retention-days: 7

  # -------------------------------------------------------------
  # Stage 3: Container Security & Image Vulnerability Scanning
  # -------------------------------------------------------------
  container-security:
    name: 🐳 Container Security Scan (Trivy Image)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Application Image
        run: |
          docker build -t devsecops-target-app:latest .

      - name: Create Reports Directory
        run: mkdir -p reports

      - name: Scan Docker Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'devsecops-target-app:latest'
          format: 'json'
          output: 'reports/trivy-image.json'
          severity: 'CRITICAL,HIGH,MEDIUM'
        continue-on-error: true

      - name: Upload Container Scan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: container-reports
          path: reports/trivy-image.json
          retention-days: 7

  # -------------------------------------------------------------
  # Stage 4: DAST (Dynamic Application Security Testing)
  # -------------------------------------------------------------
  dast-scan:
    name: 🌐 DAST Dynamic Analysis (OWASP ZAP)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Create Reports Directory
        run: mkdir -p reports

      - name: Build and Start Target Web Service
        run: |
          docker build -t devsecops-target-app:latest .
          docker run -d --name target-service -p 8000:8000 devsecops-target-app:latest
          
          # Wait for application to be healthy
          timeout 30 bash -c 'until curl -s http://localhost:8000/healthz; do sleep 1; done'

      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:8000'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'
        continue-on-error: true

      - name: Extract ZAP Reports
        run: |
          if [ -f zap-report.json ]; then
            mv zap-report.json reports/zap-report.json
          fi
          if [ -f zap-report.html ]; then
            mv zap-report.html reports/zap-report.html
          fi
        continue-on-error: true

      - name: Upload DAST Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dast-reports
          path: reports/zap*
          retention-days: 7

  # -------------------------------------------------------------
  # Stage 5: Security Gatekeeper, Triage & Unified Reporting
  # -------------------------------------------------------------
  security-gatekeeper:
    name: 🛡️ Security Gatekeeper & Policy Enforcement
    runs-on: ubuntu-latest
    needs: [secret-scan, sast-and-sca, container-security, dast-scan]
    if: always()
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Gatekeeper Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml rich

      - name: Download Secret Scan Reports
        uses: actions/download-artifact@v4
        with:
          name: gitleaks-report
          path: reports
        continue-on-error: true

      - name: Download SAST & SCA Reports
        uses: actions/download-artifact@v4
        with:
          name: sast-sca-reports
          path: reports
        continue-on-error: true

      - name: Download Container Reports
        uses: actions/download-artifact@v4
        with:
          name: container-reports
          path: reports
        continue-on-error: true

      - name: Download DAST Reports
        uses: actions/download-artifact@v4
        with:
          name: dast-reports
          path: reports
        continue-on-error: true

      - name: Run Unified Security Gatekeeper Evaluation
        id: gatekeeper
        run: |
          python run_pipeline.py --gate-only --policy security_policy.yml --reports-dir reports --fail-on-gate

      - name: Upload Consolidated SARIF to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('reports/consolidated.sarif') != ''
        with:
          sarif_file: 'reports/consolidated.sarif'
          category: 'devsecops-pipeline'
        continue-on-error: true

      - name: Publish Unified Security Dashboard Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: devsecops-unified-dashboard
          path: |
            reports/security-dashboard.html
            reports/security-summary.md
            reports/consolidated.sarif
          retention-days: 30
